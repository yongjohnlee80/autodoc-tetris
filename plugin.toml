# Tetris, as an AutoDoc plugin. AutoDoc's Plugins › Add from a git URL… clones this repository,
# asks before it runs anything, then runs [install] build here and starts `command` from this
# directory.
name     = "tetris"
title    = "Tetris"
kind     = "dialog"
protocol = 1
command  = ["./bin/autodoc-tetris"]

[dialog]
width      = 44
height     = "80%"              # of the screen's height: the well is as tall, so the pieces fall further
placements = ["right", "left"]  # designed for either side: right first; Manage plugins › Place
esc        = "hide"             # Esc hides it and the game pauses; its own menu quits (q)

[install]
build = ["go", "build", "-trimpath", "-o", "bin/autodoc-tetris", "."]
