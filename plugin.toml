# AutoTetris: Tetris, as an AutoDoc plugin. AutoDoc's Plugins › Add from a git URL… clones this repository,
# asks before it runs anything, then runs [install] build here and starts `command` from this
# directory.
name     = "tetris"
title    = "AutoTetris"
kind     = "dialog"
protocol = 1
command  = ["./bin/autodoc-tetris"]

[dialog]
width      = 44
height     = 41                 # a 40-row well and its floor; on a shorter screen the dialog fits
                                # it, the well down to 20 rows (below that it asks for more)
placements = ["right", "left"]  # designed for either side: right first; Manage plugins › Place
esc        = "hide"             # Esc hides it and the game pauses; its own menu quits (q)

[install]
build = ["go", "build", "-trimpath", "-o", "bin/autodoc-tetris", "."]
